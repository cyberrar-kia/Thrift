<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turn Thrift Into Profit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #20291c;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(201,162,39,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(201,162,39,0.08), transparent 40%);
    color: #f2efe6;
    font-family: 'Inter', sans-serif;
    padding: 24px;
  }

  .wrap { max-width: 640px; }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #c9a227;
    font-weight: 600;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 8vw, 76px);
    line-height: 1.02;
    letter-spacing: 0.01em;
    margin-bottom: 20px;
  }

  h1 span { color: #c9a227; }

  p.sub {
    font-size: 17px;
    line-height: 1.5;
    color: #cfcabb;
    max-width: 460px;
    margin: 0 auto 36px;
  }

  .cta {
    display: inline-block;
    background: #c9a227;
    color: #20291c;
    font-weight: 600;
    font-size: 17px;
    padding: 16px 38px;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .cta:hover { background: #ddb734; transform: translateY(-2px); }
  .cta:focus-visible { outline: 3px solid #f2efe6; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Free Class</div>
    <h1>Turn Secondhand<br>Into <span>Steady Income</span></h1>
    <p class="sub">Learn how to source, price, and resell thrift finds for real profit — no experience needed.</p>
    <a href="https://chat.whatsapp.com/J2MnC0CyMEZK8XFASaqmVF?s=cl&p=i&ilr=4" class="cta">Join The Free Class</a>
  </div>
</body>
</html>
